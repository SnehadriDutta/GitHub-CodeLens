<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f1117;
    --surface: #161b27;
    --surface-2: #1e2535;
    --border: rgba(255,255,255,0.07);
    --border-2: rgba(255,255,255,0.12);
    --text: #e2e8f0;
    --text-muted: #7c8da0;
    --text-dim: #4a5568;
    --accent: #4f7dff;
    --accent-dim: rgba(79,125,255,0.15);
    --accent-hover: #6b93ff;
    --user-bg: #1a2847;
    --user-border: rgba(79,125,255,0.3);
    --ai-bg: #161b27;
    --ai-border: rgba(255,255,255,0.07);
    --input-bg: #1e2535;
    --radius: 16px;
    --radius-sm: 8px;
    --font: 'DM Sans', sans-serif;
    --mono: 'JetBrains Mono', monospace;
  }

  html, body { height: 100%; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    height: 100dvh;
    overflow: hidden;
  }

  header {
    width: 100%;
    padding: 18px 24px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .header-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
    animation: pulse 2.5s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  header h1 {
    font-size: 14px;
    font-weight: 500;
    color: var(--text-muted);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    font-family: var(--mono);
  }

  #chat {
    flex: 1;
    width: 100%;
    overflow-y: auto;
    padding: 24px 24px 8px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    scroll-behavior: smooth;
  }

  #chat::-webkit-scrollbar { width: 4px; }
  #chat::-webkit-scrollbar-track { background: transparent; }
  #chat::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 4px; }

  .msg-row {
    display: flex;
    gap: 12px;
    animation: fadeUp 0.25s ease forwards;
    opacity: 0;
    transform: translateY(8px);
  }

  @keyframes fadeUp {
    to { opacity: 1; transform: translateY(0); }
  }

  .msg-row.user { justify-content: flex-end; }
  .msg-row.ai   { justify-content: flex-start; }

  .avatar {
    width: 32px; height: 32px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 500;
    font-family: var(--mono);
    margin-top: 2px;
  }

  .avatar.ai-av  { background: var(--accent-dim); color: var(--accent); border: 1px solid rgba(79,125,255,0.25); }
  .avatar.user-av{ background: var(--surface-2); color: var(--text-muted); border: 1px solid var(--border-2); }

  .bubble {
    max-width: 72%;
    padding: 14px 18px;
    border-radius: var(--radius);
    font-size: 14.5px;
    line-height: 1.75;
    border: 1px solid;
    word-break: break-word;
  }

  .msg-row.user .bubble {
    background: var(--user-bg);
    border-color: var(--user-border);
    border-bottom-right-radius: 4px;
    color: #c9d8ff;
  }

  .msg-row.ai .bubble {
    background: var(--ai-bg);
    border-color: var(--ai-border);
    border-bottom-left-radius: 4px;
    color: var(--text);
  }

  /* markdown inside AI bubble */
  .bubble h1, .bubble h2, .bubble h3 {
    font-weight: 500;
    margin: 1.2em 0 0.5em;
    color: var(--text);
    line-height: 1.4;
  }
  .bubble h1 { font-size: 18px; }
  .bubble h2 { font-size: 16px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
  .bubble h3 { font-size: 14px; color: var(--text-muted); }

  .bubble p { margin: 0.6em 0; }
  .bubble p:first-child { margin-top: 0; }
  .bubble p:last-child  { margin-bottom: 0; }

  .bubble ul, .bubble ol {
    padding-left: 1.4em;
    margin: 0.5em 0;
  }
  .bubble li { margin: 0.3em 0; }

  .bubble strong { font-weight: 500; color: #e2e8f0; }
  .bubble em { color: var(--text-muted); font-style: italic; }

  .bubble a { color: var(--accent-hover); text-decoration: underline; text-underline-offset: 3px; }

  .bubble blockquote {
    border-left: 3px solid var(--accent);
    padding: 4px 0 4px 14px;
    color: var(--text-muted);
    font-style: italic;
    margin: 0.8em 0;
  }

  .bubble hr {
    border: none;
    border-top: 1px solid var(--border-2);
    margin: 1em 0;
  }

  /* inline code */
  .bubble code:not(.hljs) {
    font-family: var(--mono);
    font-size: 12.5px;
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--border-2);
    border-radius: 5px;
    padding: 1px 6px;
    color: #c9a8ff;
  }

  /* code blocks */
  .bubble pre {
    margin: 1em 0;
    border-radius: var(--radius-sm);
    overflow: hidden;
    border: 1px solid var(--border-2);
  }

  .code-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #0d1117;
    padding: 7px 14px;
    border-bottom: 1px solid var(--border);
  }

  .code-lang {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    text-transform: lowercase;
    letter-spacing: 0.05em;
  }

  .copy-btn {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-muted);
    background: none;
    border: none;
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 4px;
    transition: color 0.15s, background 0.15s;
  }

  .copy-btn:hover { background: var(--border); color: var(--text); }
  .copy-btn.copied { color: #4ade80; }

  .bubble pre code {
    display: block;
    font-family: var(--mono);
    font-size: 12.5px;
    padding: 16px;
    overflow-x: auto;
    line-height: 1.7;
    background: #0d1117;
  }

  .bubble table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    margin: 0.8em 0;
  }

  .bubble th {
    background: var(--surface-2);
    padding: 8px 12px;
    text-align: left;
    font-weight: 500;
    font-size: 12px;
    color: var(--text-muted);
    border-bottom: 1px solid var(--border-2);
  }

  .bubble td {
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
  }

  .bubble tr:last-child td { border-bottom: none; }

  /* LaTeX-ish math blocks */
  .bubble .math-block {
    background: var(--surface-2);
    border: 1px solid var(--border-2);
    border-radius: var(--radius-sm);
    padding: 12px 16px;
    font-family: var(--mono);
    font-size: 13px;
    color: #f9e2af;
    margin: 0.8em 0;
    overflow-x: auto;
    white-space: pre;
  }

  .thinking-dot {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 14px 18px;
    background: var(--ai-bg);
    border: 1px solid var(--ai-border);
    border-radius: var(--radius);
    border-bottom-left-radius: 4px;
    max-width: 72px;
  }

  .thinking-dot span {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--text-dim);
    animation: blink 1.2s ease-in-out infinite;
  }

  .thinking-dot span:nth-child(2) { animation-delay: 0.2s; }
  .thinking-dot span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes blink {
    0%, 80%, 100% { opacity: 0.3; transform: scale(0.9); }
    40% { opacity: 1; transform: scale(1.1); }
  }

  /* input zone */
  #input-zone {
    width: 100%;
    padding: 16px 24px 24px;
    flex-shrink: 0;
  }

  #form {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    background: var(--input-bg);
    border: 1px solid var(--border-2);
    border-radius: 14px;
    padding: 10px 10px 10px 18px;
    transition: border-color 0.2s;
  }

  #form:focus-within { border-color: rgba(79,125,255,0.4); }

  #inp {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    font-family: var(--font);
    font-size: 14.5px;
    color: var(--text);
    resize: none;
    max-height: 160px;
    line-height: 1.6;
    padding: 4px 0;
  }

  #inp::placeholder { color: var(--text-dim); }

  #send {
    width: 38px; height: 38px;
    border-radius: 10px;
    background: var(--accent);
    border: none;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: background 0.15s, transform 0.1s;
  }

  #send:hover { background: var(--accent-hover); }
  #send:active { transform: scale(0.95); }
  #send:disabled { background: var(--surface-2); cursor: not-allowed; }

  #send svg { width: 16px; height: 16px; fill: white; }

  #hint {
    text-align: center;
    font-size: 11.5px;
    color: var(--text-dim);
    margin-top: 10px;
    font-family: var(--mono);
  }

  .empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    color: var(--text-dim);
    font-size: 13px;
    font-family: var(--mono);
    padding-bottom: 40px;
  }

  .empty-icon {
    width: 48px; height: 48px;
    border-radius: 12px;
    background: var(--surface-2);
    border: 1px solid var(--border-2);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 4px;
  }
</style>
</head>
<body>

<header>
  <div class="header-dot"></div>
  <h1>AI&nbsp;Assistant</h1>
</header>

<div id="chat">
  <div class="empty-state" id="empty">
    <div class="empty-icon">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4f7dff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
    </div>
    <span>Ask me anything</span>
  </div>
</div>

<div id="input-zone">
  <div id="form">
    <textarea id="inp" rows="1" placeholder="Type a message…" autocomplete="off" spellcheck="true"></textarea>
    <button id="send" title="Send">
      <svg viewBox="0 0 24 24"><path d="M22 2L11 13M22 2L15 22l-4-9-9-4 20-7z"/></svg>
    </button>
  </div>
  <p id="hint">Enter ↵ to send &nbsp;·&nbsp; Shift+Enter for new line</p>
</div>

<script>
const API = 'http://localhost:15000/api/query';
const chat = document.getElementById('chat');
const inp  = document.getElementById('inp');
const send = document.getElementById('send');
const empty = document.getElementById('empty');
let busy = false;

marked.setOptions({ breaks: true, gfm: true });

const renderer = new marked.Renderer();
renderer.code = (code, lang) => {
  const language = (lang || 'plaintext').trim();
  let highlighted;
  try {
    highlighted = hljs.highlight(code, { language, ignoreIllegals: true }).value;
  } catch {
    highlighted = hljs.highlightAuto(code).value;
  }
  const id = 'cb_' + Math.random().toString(36).slice(2);
  return `<pre><div class="code-header"><span class="code-lang">${language}</span><button class="copy-btn" onclick="copyCode(this,'${id}')">copy</button></div><code id="${id}" class="hljs">${highlighted}</code></pre>`;
};
marked.use({ renderer });

function copyCode(btn, id) {
  const code = document.getElementById(id);
  if (!code) return;
  navigator.clipboard.writeText(code.innerText).then(() => {
    btn.textContent = 'copied!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'copy'; btn.classList.remove('copied'); }, 2000);
  });
}

function addMsg(role, html) {
  if (empty) empty.remove();
  const row = document.createElement('div');
  row.className = `msg-row ${role}`;

  const av = document.createElement('div');
  av.className = `avatar ${role === 'ai' ? 'ai-av' : 'user-av'}`;
  av.textContent = role === 'ai' ? 'AI' : 'U';

  const bub = document.createElement('div');
  bub.className = 'bubble';
  bub.innerHTML = html;

  if (role === 'ai') {
    row.appendChild(av);
    row.appendChild(bub);
  } else {
    row.appendChild(bub);
    row.appendChild(av);
  }

  chat.appendChild(row);
  chat.scrollTo({ top: chat.scrollHeight, behavior: 'smooth' });
  return row;
}

function showTyping() {
  const row = document.createElement('div');
  row.className = 'msg-row ai';
  row.id = 'typing';

  const av = document.createElement('div');
  av.className = 'avatar ai-av';
  av.textContent = 'AI';

  const dot = document.createElement('div');
  dot.className = 'thinking-dot';
  dot.innerHTML = '<span></span><span></span><span></span>';

  row.appendChild(av);
  row.appendChild(dot);
  chat.appendChild(row);
  chat.scrollTo({ top: chat.scrollHeight, behavior: 'smooth' });
}

function removeTyping() {
  const el = document.getElementById('typing');
  if (el) el.remove();
}

function renderMarkdown(text) {
  const escaped = text
    .replace(/\\\[/g, '%%MATH_OPEN%%')
    .replace(/\\\]/g, '%%MATH_CLOSE%%');
  let html = marked.parse(escaped);
  html = html.replace(/%%MATH_OPEN%%([\s\S]*?)%%MATH_CLOSE%%/g, (_, eq) =>
    `<div class="math-block">${eq.trim()}</div>`
  );
  return html;
}

async function submit() {
  const q = inp.value.trim();
  if (!q || busy) return;
  busy = true;
  send.disabled = true;
  inp.value = '';
  inp.style.height = 'auto';

  addMsg('user', q.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>'));
  showTyping();

  try {
    const form = new FormData();
    form.append('query', q);
    const res = await fetch(API, {
      method: 'POST',
      body: form
    });

    if (!res.ok) throw new Error(`Server error: ${res.status}`);
    const data = await res.json();
    const text = data.response ?? JSON.stringify(data);
    removeTyping();
    addMsg('ai', renderMarkdown(text));
  } catch (err) {
    removeTyping();
    addMsg('ai', `<span style="color:#f87171">Error: ${err.message}</span>`);
  } finally {
    busy = false;
    send.disabled = false;
    inp.focus();
  }
}

send.addEventListener('click', submit);

inp.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    submit();
  }
});

inp.addEventListener('input', () => {
  inp.style.height = 'auto';
  inp.style.height = Math.min(inp.scrollHeight, 160) + 'px';
});
</script>
</body>
</html>
